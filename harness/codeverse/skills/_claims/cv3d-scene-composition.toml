# scene_frames thresholds quoted in the body, pinned to spatial/frame_metrics.py.

[[claim]]
key = "near_hit"
text = "0.5 m"
python = "codeverse.spatial.frame_metrics:NEAR_HIT_M"
scale = 1
format = "{:.1f} m"

[[claim]]
key = "content_min_establishing"
text = "20%"
python = "codeverse.spatial.frame_metrics:CONTENT_MIN_ESTABLISHING"
scale = 100
format = "{:.0f}%"

[[claim]]
key = "content_min_authored"
text = "10%"
python = "codeverse.spatial.frame_metrics:CONTENT_MIN_AUTHORED"
scale = 100
format = "{:.0f}%"

[[claim]]
