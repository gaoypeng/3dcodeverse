format = "{:.1f} m"

[[claim]]
key = "eye_max_above_ground"
text = "80 m"
python = "codeverse.spatial.frame_metrics:EYE_MAX_ABOVE_GROUND_M"
scale = 1
format = "{:.0f} m"

[[claim]]
key = "flat_modal_warn"
