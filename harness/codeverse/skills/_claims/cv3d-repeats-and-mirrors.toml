# Every number this bundle quotes, pinned to the constant it came from.
# `key` is shared across the library: two skills that can attach to one session
# must render the same text for the same key.

[[claim]]
key    = "bbox_tolerance_m"
text   = "0.01"
python = "codeverse.conventions:BBOX_TOLERANCE_M"

[[claim]]
key    = "rel_tol"
text   = "0.10"
python = "codeverse.spatial.contract:REL_TOL"
format = "{:.2f}"

[[claim]]
key    = "error_factor"
text   = "3.0"
python = "codeverse.spatial.contract:ERROR_FACTOR"
