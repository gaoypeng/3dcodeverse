name: static_object_v1
version: 1
track_hint: static_object
pass_threshold: 0.72
description: >
  Assembly-level rubric for ONE static object (furniture, tool, vehicle, appliance,
  plant, creature, building...) judged on a labelled multi-view render rig plus a
  measurement table.  Scores are per criterion; the overall is computed in code.

extra_instructions: >
  Judge what is VISIBLE in the montages and what the measurement table states; do not
  credit detail you cannot see and do not invent faults.  Use the underside / low
  views and the ground-contact crop for ground contact and hidden gaps, the top view
  for symmetry and footprint, the 3/4 views and the centre crop for overall read and
  detail, and the GEOMETRY-ONLY montage (when present) for holes, inverted faces and
  intersections.  Hidden connectors (a bracket inside a shade, a dowel inside a joint)
  are NOT defects when the parts visibly meet.  CALIBRATION — use these fixed points:
  0.9+ = every part crisp with bevels/chamfers/tapers/profiles, correct proportions,
  clean joins, sensible materials (a product photo); 0.7 = correct and complete but
  plain; 0.5 = recognisable but a stack of primitives, or one major defect (a gap, a
  floating part, a wrong proportion); 0.2 = wrong object, flat blobs, parts exploded
  or lying on its back.  A primitive box-stack and a crafted product must be ≥ 0.4
  apart.  The DEFECT CHECKLIST is binary and literal: mark an item present only when
  an image or a gate finding shows it, and cite it.
  REFINEMENT KINDS — the countable unit of geometry_detail.  A kind counts once for the
  whole object, and only when you can point at it in an image: (1) bevel / chamfer /
  fillet on an edge; (2) taper or draft along a part; (3) curve, sweep or compound
  surface where a primitive would be flat; (4) moulding or profile (a shaped edge, a
  cornice, a bead); (5) cut-out, hole, slot or notch; (6) visible wall thickness or
  hollow section (a rim, a lip, an open tube end); (7) surface relief (flutes, ribs,
  grooves, panelling, treads, weave, bark); (8) separately modelled hardware (hinge,
  knob, screw, bracket, strap, spoke, ferrule).  Colour, material and shading are NOT
  refinement kinds — read geometry_detail off the geometry-only montage first and only
  then confirm it in the shaded views.
  DETAIL AND SIZE — geometry_detail is scored against the object BUILT, not against the
  simplest version of the subject.  A 20-part model with mouldings and hardware must
  score higher on geometry_detail than a clean 5-part box-stack of the same subject,
  even when the box-stack has fewer defects; those defects belong to
  structure_plausibility, assembly_fit and craftsmanship, not here.  Conversely a large
  part count with no refinement on any part is still 0.25-0.4: many primitives are not
  detail.

criteria:
  - id: intent_fidelity
    weight: 0.22
    floor: 0.30
    title: Intent fidelity
    description: >
      Is this the object the brief asked for — category first, then every named
      attribute (counts, style, features, materials named in the brief)?  A stranger
      shown only these renders should describe the object the way the brief does.
    anchors:
      "1.0": Right category and every named attribute is present and unmistakable from the 3/4 views alone; nothing the brief asked for is missing or contradicted.
      "0.7": Right category; one named attribute is weak, generic or hard to confirm (a "slatted" back with only two slats, "mid-century" that reads merely plain), none is contradicted.
      "0.4": Right category but a named attribute is missing or clearly wrong (three legs when four were asked, no armrests when asked, wrong style or colour family).
      "0.1": Wrong category (a table for a chair), unrecognisable blobs, or the object lies on its back/side so it cannot be read as the brief.

  - id: structure_plausibility
    weight: 0.18
    floor: 0.25
    title: Structural plausibility
    description: >
      Does the assembly hold together the way a real example of this object does?
      Every part attaches where it should, is oriented correctly, reaches what it must
      reach (legs reach the ground, a shade sits on its harp, wheels sit at the hubs),
      and nothing floats, hovers, or points the wrong way.
    anchors:
      "1.0": Every part is where a real example has it, correctly oriented, visibly supported (all feet touch the ground in the low view and the ground-contact crop); the object would stand and function.
      "0.7": One part is slightly misplaced or ambiguous in support (a stretcher that ends a few mm short of a leg), but nothing floats and the object clearly stands.
      "0.4": One part visibly floats (daylight between it and its support), hovers off its mount, or is clearly in the wrong place or orientation (a backrest attached to the front edge).
      "0.1": Several parts float, the assembly is exploded apart, the object rests on its back or side, or it is not a plausible object.

  - id: geometry_detail
    weight: 0.16
    title: Geometry detail
    description: >
      How much SHAPE was actually modelled?  Count REFINEMENT KINDS (the list is in
      the rubric notes: bevel/fillet, taper, curve/sweep, moulding/profile,
      cut-out/hole/slot, visible wall thickness, surface relief, separately modelled
      hardware) and how many of the object's nameable parts carry at least one.
      Geometry only: colour, material variety and shading are scored elsewhere and
      never raise this criterion.  Credit only refinements visible in the renders —
      use the centre crop and the geometry-only montage, where shape survives and
      colour does not.
    anchors:
      "1.0": Five or more refinement KINDS are visible and at least two thirds of the nameable parts carry one; the finest features are at real hardware scale (a few mm — screw heads, hinge leaves, bead mouldings, tread edges) and the geometry montage proves they are modelled, not painted.
      "0.85": Three or four refinement kinds, on at least half the nameable parts; the object reads as a designed product rather than an assembly of stock shapes.
      "0.7": Exactly two refinement kinds, or more kinds but concentrated on one or two hero parts while everything else is stock.
      "0.55": One refinement kind on a couple of parts (tapered legs and nothing else), the rest unmodified primitives.
      "0.4": A stack of plain boxes/cylinders with sharp 90° corners; at most one token detail on one part.
      "0.25": Every part is an unmodified primitive; the only variation between parts is size, position and colour.
      "0.1": Primitive blobs or a single lump; parts are not individually shaped.
  - id: proportions_scale
    weight: 0.12
    title: Proportions and scale
    description: >
      Are the relative sizes of parts and the overall dimensions right for the object
      (use the measurement table and any stated dimensions)?  Seat height, leg
      thickness, wheel diameter, handle size must read as real-world correct.
    anchors:
      "1.0": Overall size and every part ratio are believable against the measurement table; stated dimensions are met within tolerance (±5%).
      "0.7": One part is somewhat thick/thin/short/long (legs 30% heavier than typical) but the object still reads correctly at the stated size.
      "0.4": A clearly wrong proportion (legs twice as thick as they should be, a tiny seat on a huge frame, a 1.2 m tall dining chair) or the size is off by more than ~20%.
      "0.1": Proportions are absurd (seat thicker than it is wide) or the object is the wrong order of magnitude.

  - id: assembly_fit
    weight: 0.12
    title: Assembly fit
    description: >
      Do parts that are meant to meet actually meet — tightly and without visible
      interpenetration?  Judge at object scale: a few millimetres of tolerance is fine;
      a finger-wide gap, a part jammed through another, or a sunken/protruding join
      is not.
    anchors:
      "1.0": All joins are clean and tight in the centre crop and the geometry montage; no visible gaps, no visible penetration, no z-fighting at contacts.
      "0.7": One small gap (≈ a few mm at object scale) or one shallow overlap at a join; the rest is clean.
      "0.4": A finger-wide gap a part should not have, or an obvious penetration of one part through another (a rail poking out of the far side of a leg).
      "0.1": Multiple gaps/penetrations; parts clearly not fitted to each other.

  - id: materials
    weight: 0.10
    title: Materials
    description: >
      Do surfaces read as sensible materials for each part (colour, roughness,
      metal/dielectric, and character such as wood grain or fabric where it matters)?
      A clean flat-colour look with correct assignments is acceptable; wrong or
      placeholder surfaces are not.
    anchors:
      "1.0": Every part has a convincing material with correct roughness/metalness; visible character (wood grain, brushed metal, fabric weave) where the real object has it.
      "0.7": Sensible flat or lightly-shaded colours on every part, correctly assigned (wood-brown legs, fabric-coloured seat); little character.
      "0.4": One part has a wrong or contradictory material (metal legs that look like plastic foam, one default grey part), or everything is one uniform colour.
      "0.1": Placeholder magenta/default grey everywhere, garbage noise, or materials that contradict the object.

  - id: craftsmanship_no_artifacts
    weight: 0.10
    floor: 0.30
    title: Craftsmanship and artefacts
    description: >
      Is the model clean — no z-fighting stripes, inverted normals (black faces),
      missing faces / see-through walls, stretched or torn geometry, stray
      slivers, duplicated shells, or degenerate triangles?
    anchors:
      "1.0": No artefact anywhere, INCLUDING at detail scale in the centre crop — no cracks where parts meet, no coplanar faces flickering, no stray sliver left over from a boolean, no visibly coarse facets on a surface that should read as curved; shading is smooth and consistent and the geometry montage shows closed surfaces.
      "0.85": Clean at object scale; one blemish only findable in the centre crop (a faceted curve, a hairline crack at one join, one duplicated coplanar face).
      "0.7": One small artefact (a sliver, a minor shading seam, faint z-fighting on one face) visible only in one view.
      "0.4": A clearly visible artefact — black/inverted faces, a hole in a surface, a see-through wall, obvious z-fighting stripes.
      "0.1": Artefacts dominate; the object is torn, inside-out, or visibly broken.

caps:
  - id: build_error
    when: gate
    gate: "build*"
    severity: error
    cap: 0.0
    note: the code did not build or export; nothing to score
  # Both watch `connectivity` alone (2026-08-30): over 356 static_object records it is the
  # only gate that emits floating / penetration ERRORs (540 findings), so the cap loses
  # nothing — and the veto (judges/rubrics.measured_absent) stops being switched off by a
  # failing contract gate, which had blocked it in 53 of 62 cases.
  - id: floating_part
    when: gate
    gate: "connectivity"
    severity: error
    kinds: [floating, unattached, no_contact, disconnected, unsupported, island]
    cap: 0.6
  - id: penetration_error
    when: gate
    gate: "connectivity"
    severity: error
    kinds: [penetrat, intersect, overlap, collision]
    cap: 0.7
    measures: [interpenetration]
  - id: contract_violation
    when: gate
    gate: "contract*"
    severity: error
    cap: 0.75
    note: measured bbox/part contract broken beyond tolerance
  - id: missing_must_acceptance
    when: acceptance
    cap: 0.6
    graded: true
    note: >
      0.6 + 0.4 * verified/total over the must items (2026-08-30): the flat 0.6 was the
      decisive cap on 121 of 424 verdicts (28.6 %), one unverified item scoring like ten.
      The verdict still FAILS on any unverified must item; only the score keeps its gradient.

# Binary checklist: answered by the judge, scored in code (penalty subtracted, cap applied).
defects:
  - id: wrong_object
    text: The renders show a different object category than the brief (or nothing recognisable).
    cap: 0.25
  - id: missing_named_part
    text: A part the brief or plan names is absent (no armrests when asked, three legs instead of four, no backrest).
    penalty: 0.10
    cap: 0.60
  - id: floating_part
    text: A part visibly hovers or is detached — daylight between it and what should support it (check the low view, the ground-contact crop and the geometry montage).
    penalty: 0.10
    cap: 0.60
  - id: interpenetration
    text: A part visibly passes through another in a render (a rail poking out of the far side of a leg, a leg through the seat) or a gate ERROR reports it; weld overlaps of a few mm reported as gate warnings are NOT this defect.
    penalty: 0.08
    cap: 0.70
  - id: wrong_proportions
    text: Part ratios or overall size clearly wrong (> 20%) — legs twice too thick, a tiny seat on a huge frame, the measured height far from the brief.
    penalty: 0.08
    cap: 0.70
  - id: wrong_orientation
    text: The object lies on its back or side, is upside down, or faces away from the front view (az 0°).
    penalty: 0.10
    cap: 0.50
  - id: primitive_only
    text: Two thirds or more of the nameable parts are unmodified boxes / cylinders / spheres with sharp 90° edges, and at most one part carries any bevel, taper, profile, curve or cut-out. Different colours on stock shapes do NOT count as refinement.
    penalty: 0.08
  - id: detail_below_part_count
    text: The object has TEN or more nameable parts but fewer than THREE distinct refinement kinds (the numbered list in the rubric notes) are visible across all of them together — many primitives, little shape. Count kinds, not instances; do not count colour.
    penalty: 0.05
  - id: untextured_flat
    text: Default grey / magenta placeholder materials are visible, or surfaces are unlit flat fills with no shading response. A uniform but sensible colour (an all-walnut chair, an all-oak cabinet) is NOT this defect.
    penalty: 0.05
    cap: 0.75
  - id: holes_or_inverted_faces
    text: Missing faces, see-through walls or black inverted faces are visible (especially in the geometry montage).
    penalty: 0.08
    cap: 0.60
  - id: render_artifacts
    text: Z-fighting stripes, torn or stretched geometry, or stray slivers are visible.
    penalty: 0.05
