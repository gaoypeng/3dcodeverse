    TWO HERO PROPS ARE AUTHORED IN BLENDER WITH bpy AND COMPILED TO GLB (asset kind blender_glb), then loaded
    into the three.js scene: (1) StoneLantern — a carved granite lantern about 1.7 m tall with a chamfered
    cap, a pierced fire box, a lotus-carved plinth and moss-worn edges, in DARK weathered grey-green granite
    (0x4a4f48), never white; place three of them along the path, each with a warm point light in its fire
    box. (2) BronzeCenser — a three-legged bronze incense burner about 0.9 m tall with a domed pierced lid,
    two ring handles and a relief band, in dark patinated bronze with warm specular highlights.

    Everything else is procedural three.js: maple trees with deep crimson foliage (0x7d1f2b) and pines in
    very dark green (0x16261c) — never mint or pastel — the arched wooden bridge in dark stained timber, stone
    paving, railings and the temple hall with warm glowing shoji panels.

    A custom GLSL water material is the HERO EFFECT and must be unmistakable: the pond is dark (0x081018)
