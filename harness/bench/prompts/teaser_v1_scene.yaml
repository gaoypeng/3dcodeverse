    units, hanging cables and a steam grate dress the walls.

    Rain is THIN BRIGHT VERTICAL STREAKS, not dots: draw it as LineSegments or as very narrow elongated quads
    about 0.4 m long and 0.01 m wide, a few thousand of them, falling fast and re-seeding at the top, catching
    the sign colours. NEVER render rain as square point sprites or large white squares. Steam from the grate
    is a soft, low-opacity translucent wisp (opacity 0.12-0.25) that does not read as a solid white blob.

    Keep the overall frame dark and saturated — deep blacks, hot magenta and cyan, no grey haze — and let
