    TWO HERO PROPS ARE AUTHORED IN BLENDER WITH bpy AND COMPILED TO GLB (asset kind blender_glb), then loaded
    into the three.js scene: (1) ClinkerSkiff — a lapstrake wooden skiff about 4 m long, upturned on trestles,
    with overlapping planks, visible ribs and a bevelled stem; (2) PotbellyStove — a cast-iron potbelly stove
    about 1.1 m tall with a bellied body, a bevelled door with a latch, claw feet and a flue collar, its door
