name: articulated_v1
track: articulated_object
language: urdf_blender
description: >
  12 articulated-object prompts (URDF + bpy link meshes), 4 per tier.  must_have
  items name the joints the judge/FK sweep must verify.
prompts:
  - id: art_easy_cabinet_door
    tier: easy
    category: furniture
    prompt: a kitchen wall cabinet with a single hinged door that swings open 110 degrees
    must_have: [cabinet box, one door on a vertical hinge axis, door swings outward up to 110 degrees, handle on the free edge]
  - id: art_easy_drawer_unit
    tier: easy
    category: furniture
    prompt: a bedside drawer unit with two drawers that slide out
    must_have: [carcass, two drawers on prismatic slides, drawers pull out at least 30 cm, drawer pulls]
  - id: art_easy_laptop
    tier: easy
    category: electronics
    prompt: a laptop whose screen lid opens from closed to 135 degrees on a hinge at the back edge
    must_have: [base with keyboard, lid with screen, revolute hinge along the back edge, range 0 to 135 degrees]
  - id: art_easy_scissors
    tier: easy
    category: tools
    prompt: a pair of scissors with two blades pivoting about a central screw
    must_have: [two blade-and-handle halves, one revolute pivot at the screw, blades cross when closed, opens about 60 degrees]
  - id: art_med_folding_chair
    tier: medium
    category: furniture
    prompt: a folding chair whose seat lifts up and whose front legs pivot toward the back legs to fold flat
    must_have: [seat hinged to the frame, front leg frame pivoting about a cross bar, back rest, folds to a flat state]
  - id: art_med_desk_lamp
    tier: medium
    category: lighting
    prompt: a desk lamp with a round base, a lower arm that pivots at the base and an upper arm that pivots at the elbow, ending in a shade
    must_have: [weighted base, lower arm revolute at base, upper arm revolute at elbow, shade at the tip, both joints have limits]
  - id: art_med_toolbox
    tier: medium
    category: tools
    prompt: a metal toolbox with a lid hinged along the back edge and a fold-down carry handle on top of the lid
    must_have: [box body, lid hinged at the rear edge, handle hinged on the lid, lid opens 100 degrees, latch on the front]
  - id: art_med_wheelbarrow
    tier: medium
    category: garden
    prompt: a wheelbarrow with a spinning front wheel and a tray that tips forward on its axle to dump
    must_have: [tray, two handles, two rear legs, front wheel on a continuous axle joint, tipping joint for the tray]
  - id: art_hard_door_handle
    tier: hard
    category: architecture
    prompt: a house door in its frame with hinges, a lever handle that rotates down 40 degrees, and a latch bolt that retracts when the handle turns
    must_have: [door frame, door on vertical hinges, lever handle revolute, latch bolt prismatic, door swings 90 degrees]
  - id: art_hard_treasure_chest
    tier: hard
    category: props
    prompt: a wooden treasure chest with a domed lid on rear hinges, a hasp that flips over a staple, and a small inner tray that slides sideways
    must_have: [chest body, domed lid revolute at rear, hasp revolute on the lid, sliding inner tray, iron bands]
  - id: art_hard_swivel_chair
    tier: hard
    category: furniture
    prompt: an office swivel chair with a five-star base on casters, a gas lift that raises the seat, a seat that swivels, and a backrest that tilts back
    must_have: [five-arm base with five caster wheels, prismatic gas lift, continuous swivel joint, backrest tilt joint with limits, armrests]
  - id: art_hard_bicycle_wheel_stand
    tier: hard
    category: vehicles
    prompt: a bicycle front wheel and fork on a repair stand, with the wheel spinning on its axle, the fork turning about the steering tube, and a brake caliper whose arms pinch the rim
    must_have: [spoked wheel on a continuous axle joint, fork on a steering revolute joint, two brake arms pivoting toward the rim, stand base]
