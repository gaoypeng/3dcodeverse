# CLI flags used, not expressible in this schema:
#   --style "expensive lighting-catalogue product shot: warm polished brass against clear cut crystal and frosted glass, every facet catching a highlight, strong specular sparkle, no flat matte surfaces"
#   --must-not "a chandelier with no hanging crystal drops, or with the drops too small or too few to see"
#   --must-not "plain white cylinder shades with no finial"
#   --must-not "drops merged into the arms or hidden inside the tiers"
#   --candidates 2
#   --profile quality
- id: tsr_tjs_deco_chandelier_v2
  tier: hard
  category: lighting
  tags:
  - teaser
  - rerun
  language: threejs
  prompt: 'an art-deco brass chandelier dripping with cut crystal: a stepped brass ceiling canopy and a chain
    drop to a fluted central stem; two tiers of curved brass arms, six above and eight below, each ending
    in a frosted glass candle sleeve with a small tapered flame-tip finial; and hanging from the rim of BOTH
    tiers, in even concentric rings, more than forty stepped faceted crystal drops - long slender prisms with
    cut facets, each hanging free on its own short brass link so the whole lower half of the fixture reads
    as a curtain of glass; a fluted clear glass bowl at the crown under the stem.

    '
  must_have:
  - central fluted brass stem with a stepped ceiling canopy and a chain of at least 5 visible links above
    it
  - an upper tier of 6 curved brass arms and a lower tier of 8 curved brass arms, each tier evenly spaced
  - a frosted glass candle sleeve with a small tapered flame-tip finial at the end of every arm
  - MORE THAN 40 faceted crystal drops, clearly visible as separate slender prisms, hanging in even concentric
    rings from the rims of BOTH tiers
  - each crystal drop is at least 0.06 m long, hangs vertically on its own short brass link, and hangs free
    below its tier
  - the rings of drops are the dominant visual feature of the lower half of the chandelier
  - fluted clear glass bowl at the crown under the stem
  - overall diameter about 0.90 m and overall height about 1.10 m
  - warm brass arms and stem clearly distinct in colour from the clear crystal drops and the frosted white
    shades
  - no drop intersects an arm, a shade or another drop
  dimensions_m:
    width: 0.9
    depth: 0.9
    height: 1.1
