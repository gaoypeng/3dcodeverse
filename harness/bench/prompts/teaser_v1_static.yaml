#   --profile quality
- id: tsr_cad_radial_engine_v2
  tier: hard
  category: mechanisms
  tags:
  - teaser
  - rerun
  - hero
  language: cadquery
  prompt: 'a five-cylinder radial aero engine displayed on a low steel stand, in the correct museum orientation:
    ONE cylinder points straight UP at top dead centre and the other four are at 72 degree steps, so there
    is NO cylinder pointing straight down and the engine sits clear of the ground on its stand. A dark grey
    machined steel crankcase carries a bolted circular front cover and a splined propeller hub on the axis;
    each of the five barrels is a pale satin aluminium tube wrapped in evenly pitched square cooling fins,
    capped by a domed head with a black rocker cover; a slim brass pushrod tube lies flush along the front
    of each barrel from the crankcase to its rocker cover; a short polished steel exhaust stub leaves each
    head, all five swept the same way around the ring.

    '
  must_have:
  - one cylinder barrel pointing straight up at top dead centre, the other four at 72 degree steps around
    the crankcase axis
  - no cylinder barrel pointing straight down; the lowest part of the engine is the steel stand, and the stand
    sits flat on the ground plane
  - a low steel stand under the crankcase, welded to it, carrying the whole engine clear of the ground
  - at least 8 cooling fins on every barrel, all the same pitch and the same outer diameter
  - a domed head with a black rocker cover on each cylinder, sitting flush on the top of its barrel
  - one brass pushrod tube per cylinder, lying flush along the barrel from the crankcase to its rocker cover,
    touching both
  - circular crankcase about 0.36 m in diameter with a front cover carrying at least 8 bolt heads on a circular
    pattern
  - propeller hub on the crankcase axis with at least 6 bolt holes
  - one exhaust stub per head, each rooted flush in its head, all five angled the same way around the ring
  - pale aluminium barrels, a darker steel crankcase, brass pushrod tubes and black rocker covers as four
    clearly distinct part colours
  - no barrel, pushrod or exhaust stub intersects or floats away from a neighbour
  dimensions_m:
    width: 0.9
    depth: 0.42
    height: 0.98
# SHIPPED at a LOWER judged score than the run it replaces (0.600 vs 0.841): v1 was a clean brass
# armature with plain white shades and ZERO hanging crystal, i.e. none of the sparkle the prompt
