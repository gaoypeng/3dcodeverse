# compare_v3 — harness-vs-oneshot arms on the v2 static battery, widened to 12.
#
# The 8 compare_v2 prompts VERBATIM (same ids, so recorded compare_v2 cells stay
# valid on resume) plus 4 more drawn verbatim from static_objects_v2 to widen
# coverage: 1 extra medium control (tools) and 3 hard prompts in categories the v2
# set lacked (vehicles, animals, props), covering the thin_features+curved_organic,
# pure curved_organic and multi_material axes a second time.
# must_have is the FIXED judge's acceptance checklist for every arm (no plan-derived
# items) so harness and one-shot are judged alike.
name: compare_v3
track: static_object
language: blender
description: >
  12 static-object prompts (blender / bpy) shared with static_objects_v2, used to
  compare the harness loop against raw one-shot generation under ONE fixed judge.
  3 medium controls + 9 hard across the v2 difficulty axes; superset of compare_v2.
prompts:
  - id: cmp_med_dining_chair
    tier: medium
    category: furniture
    tags: [control, "axis:decomposition"]
    prompt: a mid-century wooden dining chair with a slatted backrest and tapered legs
    must_have:
      - "four tapered legs, each thinner at the floor than at the seat"
      - "seat slab about 0.42 m wide"
      - "seat surface about 0.45 m above the floor"
      - "backrest with at least 3 vertical slats"
      - "back legs continue up into the backrest posts"
      - "backrest top rail between 0.80 m and 0.95 m above the floor"
      - "all four feet touch the ground plane"
      - "no leg or slat intersects the seat slab"
    dimensions_m: {width: 0.45, depth: 0.50, height: 0.90}
  - id: cmp_med_toaster
    tier: medium
    category: appliances
    tags: [control, "axis:curved_organic"]
    prompt: a two-slot retro toaster with rounded chrome body, a lever on the side, a browning dial and a crumb tray
    must_have:
      - "2 bread slots on the top face"
      - "each slot about 0.13 m long and under 0.04 m wide"
      - "lever on one end face"
      - "round dial knob on the front face"
      - "rounded body with no sharp vertical edges"
      - "crumb tray seam line near the base"
      - "4 small feet"
      - "body about 0.28 m wide and 0.19 m tall"
    dimensions_m: {width: 0.28, depth: 0.17, height: 0.19}
  - id: cmp_hard_coffee_grinder
    tier: hard
    category: mechanisms
    tags: ["axis:decomposition"]
    prompt: >
      a hand-crank coffee grinder: square wooden box body with a small front drawer,
      cast-iron dome top with an open hopper funnel, a conical burr visible inside
      the funnel throat, and a top crank arm with a wooden knob
    must_have:
      - "square wooden box body about 0.14 m wide and 0.12 m tall"
      - "front drawer about 0.05 m tall with a round knob, in the lower half of the box"
      - "drawer front sits flush in its opening with a visible seam"
      - "metal dome top mounted on the box"
      - "open hopper funnel about 0.08 m across at the rim"
      - "conical burr visible inside the funnel throat"
      - "central spindle about 0.01 m thick rising from the burr through the dome"
      - "crank arm about 0.11 m long attached to the spindle top"
      - "wooden knob on a short vertical pin at the crank's free end"
      - "adjustment nut on the spindle above the crank hub"
    dimensions_m: {width: 0.14, depth: 0.14, height: 0.30}
  - id: cmp_hard_garden_arch
    tier: hard
    category: garden
    tags: ["axis:thin_features"]
    prompt: >
      a wrought-iron garden arch: two lattice side frames, a semicircular arch head
      filled with S-scrolls, spear-point finials and a tie bar at the spring line
    must_have:
      - "2 side frames, each of 2 uprights about 0.01 m thick"
      - "diamond lattice bars between the uprights of each side frame"
      - "semicircular arch head spanning about 1.2 m between the side frames"
      - "at least 6 S-scrolls filling the arch head"
      - "at least 4 scrolls in each side frame"
      - "3 spear-point finials on top of the arch"
      - "horizontal tie bar connecting both sides at the spring line"
      - "small ground plates under all 4 upright feet"
      - "overall height about 2.3 m"
      - "all bars slender: no member thicker than 0.02 m"
    dimensions_m: {width: 1.4, depth: 0.5, height: 2.3}
  - id: cmp_hard_violin
    tier: hard
    category: musical_instruments
    tags: ["axis:thin_features", "axis:curved_organic"]
    prompt: >
      a violin: hourglass body with C-bout waists, arched top with two f-holes, a
      bridge, four strings from tailpiece over the bridge along the fingerboard to
      the pegbox, a scroll head, four tuning pegs and a chin rest
    must_have:
      - "hourglass body with 2 concave C-bout waist cutaways"
      - "body length about 0.36 m"
      - "top plate visibly arched, not flat"
      - "2 f-holes through the top, one each side of the bridge"
      - "bridge about 0.03 m tall standing upright between the f-holes"
      - "4 strings running in parallel from tailpiece to pegbox"
      - "strings pass over the bridge with a visible break angle"
      - "black fingerboard extending over the body without touching it"
      - "spiral scroll at the head"
      - "4 tuning pegs, 2 per side of the pegbox"
      - "tailpiece anchored toward the end button"
      - "chin rest beside the tailpiece"
      - "total length about 0.60 m"
    dimensions_m: {length: 0.60, width: 0.21, height: 0.09}
  - id: cmp_hard_bonsai_rock
    tier: hard
    category: plants
    tags: ["axis:curved_organic"]
    prompt: >
      a root-over-rock bonsai: a shallow oval pot with soil, a rounded rock gripped
      by exposed roots, a tapering trunk with two pronounced curves, and five
      distinct flattened foliage pads
    must_have:
      - "shallow oval pot about 0.30 m long with a rim and small feet"
      - "soil surface inside the pot"
      - "rounded rock about 0.12 m tall sitting on the soil"
      - "at least 4 roots gripping over the rock faces and entering the soil"
      - "trunk rising from the rock top with at least 2 pronounced curves"
      - "trunk tapers from about 0.04 m at the base to under 0.015 m at the apex"
      - "5 distinct flattened foliage pads with gaps between them"
      - "lowest branch extends beyond the pot rim"
      - "no foliage pad touches the soil or the rock"
      - "overall height about 0.50 m"
    dimensions_m: {height: 0.50, length: 0.45}
  - id: cmp_hard_bay_window
    tier: hard
    category: buildings
    tags: ["axis:arch_detail", "axis:decomposition"]
    prompt: >
      a Victorian bay window facade section: a three-sided bay projecting from a
      clapboard wall, a sash window with divided panes in each face, panel aprons,
      corner pilasters, scroll brackets and a dentil cornice under a faceted roof cap
    must_have:
      - "three-sided bay projecting from a flat wall section"
      - "center face wider than the 2 angled side faces"
      - "side faces angled about 45 degrees from the wall"
      - "sash window in each of the 3 faces"
      - "upper sash of each window divided into at least 4 panes by muntins"
      - "continuous sill band under all 3 windows"
      - "recessed panel apron under each window"
      - "pilasters at the 4 vertical bay corners"
      - "cornice with at least 10 dentil blocks across the bay"
      - "at least 4 scroll brackets under the bay roof"
      - "three-faceted roof cap over the bay"
      - "horizontal siding boards on the flat wall section"
    dimensions_m: {width: 3.4, height: 3.2, depth: 1.0}
  - id: cmp_hard_drafting_table
    tier: hard
    category: furniture
    tags: ["axis:multi_material", "axis:decomposition"]
    prompt: >
      a drafting table setup: tilted drawing board on a trestle frame with quadrant
      tilt brackets, a parallel ruler riding on side rails, a pen tray, a sheet of
      paper held by two corner clips, a clamp-on two-arm lamp aimed at the board,
      and a stool with a footring
    must_have:
      - "drawing board about 1.0 m by 0.7 m tilted about 20 degrees"
      - "parallel ruler bar spanning the board width"
      - "ruler rides on a rail or wire at each side edge"
      - "pen tray along the bottom edge of the board"
      - "trestle legs with a cross stretcher"
      - "quadrant tilt bracket with a knob at each of the board's 2 sides"
      - "sheet of paper on the board held by clips at 2 corners"
      - "lamp clamped to a top corner of the board"
      - "lamp has 2 arm segments and a shade aimed down at the board"
      - "stool with a round seat about 0.65 m high"
      - "stool footring between its legs"
      - "board top edge about 1.1 m above the floor"
    dimensions_m: {width: 1.1, depth: 0.9, height: 1.2}
  - id: cmp_med_hand_drill
    tier: medium
    category: tools
    tags: [control, "axis:decomposition"]
    prompt: a cordless power drill with a pistol grip, trigger, battery pack in the base of the grip and a keyless chuck holding a drill bit
    must_have:
      - "pistol-grip body with the grip angled back from vertical"
      - "trigger recessed at the top of the grip"
      - "battery block under the grip, wider than the grip"
      - "chuck at the front, about 0.04 m diameter"
      - "drill bit protruding about 0.08 m from the chuck"
      - "side vents on the motor housing"
      - "overall length about 0.22 m from chuck tip to body rear"
      - "overall height about 0.24 m from battery base to body top"
    dimensions_m: {length: 0.22, height: 0.24}
  - id: cmp_hard_penny_farthing
    tier: hard
    category: vehicles
    tags: ["axis:thin_features", "axis:curved_organic"]
    prompt: >
      a penny-farthing bicycle: huge spoked front wheel with pedal cranks on its hub,
      small spoked rear wheel, curved backbone tube, front fork, handlebar and a
      sprung leather saddle
    must_have:
      - "front wheel about 1.3 m diameter with at least 24 thin spokes"
      - "rear wheel about 0.40 m diameter with at least 12 spokes"
      - "tyres no thicker than 0.03 m"
      - "backbone tube arcing from the fork crown down to the rear wheel fork"
      - "front fork straddling the big wheel to its hub"
      - "handlebar with 2 grips above the front hub"
      - "2 pedal cranks on the front hub with pedals, opposed at 180 degrees"
      - "saddle on the backbone behind the handlebar, on a visible spring"
      - "small mounting step peg on the backbone above the rear wheel"
      - "both wheels touch the ground plane"
    dimensions_m: {length: 1.7, height: 1.5}
  - id: cmp_hard_seated_cat
    tier: hard
    category: animals
    tags: ["axis:curved_organic"]
    prompt: >
      a domestic cat sitting upright: haunches on the ground, straight vertical
      front legs, tail curled around beside the front paws, short muzzle and
      triangular ears
    must_have:
      - "upright seated pose with haunches on the ground and chest raised"
      - "2 straight front legs, nearly vertical"
      - "front paws on the ground between the haunches"
      - "hind legs folded with thighs bulging wider than the chest"
      - "tail about 0.30 m long curling around to lie beside the front paws"
      - "head with a short muzzle, 2 eyes and a nose"
      - "2 triangular ears about 0.04 m tall"
      - "back forms a smooth continuous curve from neck to tail base"
      - "silhouette narrows from haunches up to the shoulders"
      - "overall height about 0.35 m"
    dimensions_m: {height: 0.35, depth: 0.25}
  - id: cmp_hard_telescope_tripod
    tier: hard
    category: props
    tags: ["axis:multi_material", "axis:decomposition"]
    prompt: >
      a brass refractor telescope on a wooden tripod: main tube with an objective
      ring, a thinner draw tube with an eyepiece cup, a clamping collar and cradle
      on a pan-tilt head, three splayed legs joined by a spreader tray, metal feet
    must_have:
      - "main tube about 0.7 m long and 0.08 m diameter"
      - "objective ring at the front of the tube"
      - "draw tube about 0.05 m diameter extending from the rear, thinner than the main tube"
      - "eyepiece cup at the draw tube end"
      - "clamping collar around the main tube's balance point"
      - "cradle connecting the collar to a pan-tilt head"
      - "tension knob on the head"
      - "3 wooden legs splayed outward, each about 1.2 m long"
      - "triangular spreader tray connecting the legs at about 0.7 m height"
      - "metal feet at the leg tips"
      - "tube tilted upward between 20 and 40 degrees"
      - "eyepiece height about 1.5 m above the ground"
    dimensions_m: {height: 1.7}
