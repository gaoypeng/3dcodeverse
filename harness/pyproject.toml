[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "3dcodeverse"
version = "0.0.11"
description = "3dcodeverse: deterministic instruments (build, measure, render, gate, judge brief, score) for a coding agent writing raw 3D code (Blender / CadQuery / Three.js / URDF / GLSL) — the `3dcode` command line of the 3dcodeverse plugin."
readme = "README.md"
# One fixed version: 3.13 (owner's decision 2026-08-26 — no floor, no matrix).
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
]
dependencies = [
  "pydantic>=2.12",  # Field(exclude_if=...)
  "pydantic-settings>=2.3",
  "pyyaml>=6",
  "numpy>=1.26",
  "trimesh>=4.4",
  "python-fcl>=0.7",
  "pillow>=10",
]

[project.optional-dependencies]
# What each extra unlocks is documented in docs/INSTALL.md.
cad = ["cadquery>=2.4"]                                   # language `cadquery`
urdf = ["yourdfpy>=0.0.56", "scipy>=1.11"]                # track `articulated_object` (urdf_blender)
graphics = ["moderngl>=5.8"]                              # track `graphics` (glsl_shader / opengl_python)
mesh = ["shapely>=2.0", "networkx>=3.2", "matplotlib>=3.8"]  # cross_section area, mesh split, judge slices
all = ["3dcodeverse[cad,urdf,graphics,mesh]"]
dev = ["ruff>=0.5"]

[project.scripts]
3dcode = "codeverse3d.cli:main"

[tool.setuptools.packages.find]
include = ["codeverse3d*"]

[tool.setuptools.package-data]
# Runtime data: the rubrics, the language wrappers and the scene_threejs effect library.
codeverse3d = ["judges/rubrics/*.yaml", "languages/**/wrappers/*", "languages/**/starter/**/*", "spatial/*.json"]

[tool.setuptools.exclude-package-data]
codeverse3d = ["**/__pycache__/*"]   # a wheel must not carry the build host's bytecode

[tool.ruff]
line-length = 100
target-version = "py313"  # == requires-python: one fixed version

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
