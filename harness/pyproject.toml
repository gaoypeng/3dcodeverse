[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "3dcodeverse"
version = "0.1.0"
description = "3dcodeverse: a data-flywheel harness for LLM-written 3D code (Blender / CadQuery / Three.js / URDF / GLSL) across static objects, articulated objects and scenes."
readme = "README.md"
# Floor = 3.10 (the oldest interpreter the whole dependency set still resolves on and the
# offline suite is green on); developed and measured on 3.13.  CI runs both ends.
# Nothing in the package uses a 3.11+ stdlib name directly — the three that were used
# (StrEnum, datetime.UTC, tomllib) live behind codeverse/_compat.py.
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
]
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "click>=8.1",   # imported directly by cli/cost_cmd.py (typer re-exports it, but we use it by name)
  "rich>=13",
  "jinja2>=3.1",
  "pyyaml>=6",
  "numpy>=1.26",
  "trimesh>=4.4",
  "python-fcl>=0.7",
  "pillow>=10",
  "google-genai>=1.0",
  "anthropic>=0.40",
  "openai>=1.40",
  "playwright>=1.45",
  'tomli>=2.0; python_version < "3.11"',   # stdlib `tomllib` backport — see codeverse/_compat.py
]

[project.optional-dependencies]
# What each extra unlocks is documented in docs/INSTALL.md §4.
cad = ["cadquery>=2.4"]                                   # language `cadquery`
urdf = ["yourdfpy>=0.0.56", "scipy>=1.11"]                # track `articulated_object` (urdf_blender)
graphics = ["moderngl>=5.8"]                              # track `graphics` (glsl_shader / opengl_python)
mesh = ["shapely>=2.0", "networkx>=3.2", "manifold3d>=2.3"]  # cross_section area, mesh split, joint-sweep booleans
mcp = ["mcp>=1.0"]                                        # `3dcv mcp` spatial-tool server for the agentic CLIs
flywheel = ["pyarrow>=15"]                                # `3dcv flywheel export --pack` (parquet)
all = ["3dcodeverse[cad,urdf,graphics,mesh,mcp,flywheel]"]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.5", "pyarrow>=15",
       # the Agent Skills reference validator (CLI: `agentskills`).  Pure python,
       # click + strictyaml.  tests/skills/test_spec_compliance.py runs it over every
       # bundle and skips cleanly when it is absent, so it is dev-only on purpose:
       # the spec is the arbiter of our library, not a runtime dependency of it.
       "skills-ref>=0.1.1"]

[project.scripts]
3dcv = "codeverse.cli.main:app"
3dcodeverse = "codeverse.cli.main:app"

[tool.setuptools.packages.find]
include = ["codeverse*"]

[tool.setuptools.package-data]
# Every non-python file a runtime reads at call time.  `languages/**/*.md` + the
# scene starter tree were missing and `spatial/js/*` matched nothing at all (no such
# directory), so a wheel install shipped no starter files: skeleton.write_example()
# rglob'd an absent directory and wrote ZERO files while reporting success.
# `skills/**/*` carries the SKILL.md bundles + their references/: an installed wheel that
# ships none of them routes an empty set, and the failure is silent (the run still passes,
# the skill simply never appears).  tests/skills/test_packaging.py builds a wheel and
# asserts the files are in it.
codeverse = ["prompts/**/*", "judges/rubrics/*.yaml", "languages/**/wrappers/*",
             "languages/**/*.md", "languages/**/starter/**/*", "skills/**/*"]

[tool.setuptools.exclude-package-data]
codeverse = ["**/__pycache__/*"]   # a wheel must not carry the build host's bytecode

[tool.ruff]
line-length = 100
target-version = "py312"  # == requires-python floor: no 3.13+ idiom may slip in

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 600
# Live tests are OPT-IN (`pytest -m live`).  Without this, a bare `pytest` on a machine
# that happens to have API keys configured fires real requests, and during a provider
# outage it hangs instead of failing — which is exactly what happened on 2026-08-24.
# Everyone's default run is now the offline suite CI runs.
addopts = ["-m", "not live"]
markers = [
  "live: needs network + API keys (deselect with -m 'not live')",
  "blender: needs a Blender binary",
  "node: needs node + runtime_js deps",
  "slow: recomputes something from bench/out (deselect with -m 'not slow')",
]
