# Numbers this bundle quotes, pinned to the constants the contract gate actually reads.
# Move BBOX_TOLERANCE_M / REL_TOL / ERROR_FACTOR and the test that ships this skill fails.

[[claim]]
key    = "bbox_tolerance_m"
text   = "1 cm"
python = "codeverse3d.conventions:BBOX_TOLERANCE_M"
scale  = 100
format = "{:.0f} cm"

[[claim]]
key    = "bbox_rel_tol"
text   = "0.10"
python = "codeverse3d.spatial.contract:REL_TOL"
format = "{:.2f}"

[[claim]]
key    = "bbox_error_factor"
text   = "3x"
python = "codeverse3d.spatial.contract:ERROR_FACTOR"
format = "{:.0f}x"
