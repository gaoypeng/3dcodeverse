# Every number this bundle quotes, pinned to the constant it came from.
# `key` is shared across the library: two skills that can attach to one session
# must render the same text for the same key.

[[claim]]
key    = "bbox_tolerance_m"
text   = "0.01"
python = "codeverse3d.conventions:BBOX_TOLERANCE_M"

[[claim]]
key    = "rel_tol"
text   = "0.10"
python = "codeverse3d.spatial.contract:REL_TOL"
format = "{:.2f}"

[[claim]]
key    = "error_factor"
text   = "3.0"
python = "codeverse3d.spatial.contract:ERROR_FACTOR"

# references/instances.md works the tolerance through for one part

[[claim]]
key     = "bbox_tolerance_m"
file    = "references/instances.md"
text    = "0.01"
python  = "codeverse3d.conventions:BBOX_TOLERANCE_M"
context = "max(0.01, 0.10 * 0.04)"

[[claim]]
key     = "rel_tol"
file    = "references/instances.md"
text    = "0.10"
python  = "codeverse3d.spatial.contract:REL_TOL"
format  = "{:.2f}"
context = "max(0.01, 0.10 * 0.04)"
