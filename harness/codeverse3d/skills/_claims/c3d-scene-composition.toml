# The camera-placement numbers quoted in the body, pinned to spatial/frame_metrics.py.

[[claim]]
key = "near_hit"
text = "0.5 m"
python = "codeverse3d.spatial.frame_metrics:NEAR_HIT_M"
scale = 1
format = "{:.1f} m"

[[claim]]
key = "eye_min_above_ground"
