# compare_v4 — harness-vs-oneshot arms on the UNION of the two static batteries (40 prompts).
#
# Why: the compare_v2/v3 batteries hold 8/12 prompts, and docs/report.html measured that an
# 8-prompt paired battery resolves a real difference of ~0.25, not the 0.02 the profiles are
# tuned to.  This battery is every static_objects_v2 prompt (4 medium controls + 16 hard, all
# with dimensions_m) plus every static_objects_v1 prompt whose text is not already in v2
# (8 easy + 4 medium + 8 hard), ids kept VERBATIM from their source battery so recorded
# cells of those batteries stay comparable.  Prompt-text duplicates dropped from v1:
# furn_med_dining_chair, veh_med_pickup, tool_med_hand_drill, appl_med_toaster (== ctrl_*).
#
# must_have is the FIXED judge's acceptance checklist for every arm (no plan-derived items)
# so harness and one-shot are judged alike.  Tiers: 8 easy / 8 medium / 24 hard.
name: compare_v4
track: static_object
language: blender
description: >
  40 static-object prompts (blender / bpy) — the union of static_objects_v2 and
  static_objects_v1 by prompt text — used to compare the harness loop against raw
  one-shot generation under ONE fixed judge with enough prompts for a paired CI
  narrower than the effects claimed.  8 easy / 8 medium / 24 hard.
prompts:
- id: ctrl_med_dining_chair
  tier: medium
  category: furniture
  tags:
  - control
  - axis:decomposition
  prompt: a mid-century wooden dining chair with a slatted backrest and tapered legs
  must_have:
  - four tapered legs, each thinner at the floor than at the seat
  - seat slab about 0.42 m wide
  - seat surface about 0.45 m above the floor
  - backrest with at least 3 vertical slats
  - back legs continue up into the backrest posts
  - backrest top rail between 0.80 m and 0.95 m above the floor
  - all four feet touch the ground plane
  - no leg or slat intersects the seat slab
  dimensions_m:
    width: 0.45
    depth: 0.5
    height: 0.9
- id: ctrl_med_pickup
  tier: medium
  category: vehicles
  tags:
  - control
  - axis:decomposition
  prompt: a pickup truck with a two-door cab, open cargo bed, wheel arches and side mirrors
  must_have:
  - cab with windshield and 2 side windows
  - open rear bed with 3 walls and a tailgate
  - 4 wheels with hubs, all touching the ground
  - wheel diameter about 0.75 m
  - front grille and 2 headlights
  - 2 side mirrors on stalks
  - bed floor about 0.80 m above the ground
  - overall length about 5.2 m
  dimensions_m:
    length: 5.2
    width: 1.9
    height: 1.8
- id: ctrl_med_toaster
  tier: medium
  category: appliances
  tags:
  - control
  - axis:curved_organic
  prompt: a two-slot retro toaster with rounded chrome body, a lever on the side, a browning dial and
    a crumb tray
  must_have:
  - 2 bread slots on the top face
  - each slot about 0.13 m long and under 0.04 m wide
  - lever on one end face
  - round dial knob on the front face
  - rounded body with no sharp vertical edges
  - crumb tray seam line near the base
  - 4 small feet
  - body about 0.28 m wide and 0.19 m tall
  dimensions_m:
    width: 0.28
    depth: 0.17
    height: 0.19
- id: ctrl_med_hand_drill
  tier: medium
