# Tooling config for the evaluation code.  Nothing here is installed: `llm` runs from this directory.
[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["llm"]   # llm/ keeps its own style

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["llm", "codeverse3d"]

[tool.pytest.ini_options]
testpaths = ["llm/tests"]
timeout = 600
addopts = ["-m", "not live", "-n", "auto", "--dist", "worksteal"]
markers = [
  "live: needs network + API keys (deselect with -m 'not live')",
  "blender: needs a Blender binary",
  "node: needs node + runtime_js deps",
]
