# SHIPPED. Supersedes tsr_art_grandfather_clock (0.600), which rendered the trunk door pane as an
# OPAQUE white panel, hiding the pendulum and weights — the whole reason the prompt was picked.

# CLI flags used, not expressible in this schema:
#   --style "English 18th-century longcase clock, dark chocolate walnut with near-black mouldings against warm polished brass, high material contrast"
#   --candidates 2
#   --profile quality
- id: tsr_art_grandfather_clock_v2
  tier: hard
  category: furniture
  tags:
  - teaser
  - rerun
  - motion
  prompt: 'a longcase grandfather clock in dark figured walnut with working articulation: a broken-arch bonnet
    with two turned finials over reeded columns, a warm brass dial with a silvered chapter ring and blued
    steel hour and minute hands, a glazed trunk door on brass hinges with CLEAR TRANSPARENT glass so the movement
    is visible through it, a long pendulum with a large polished brass lenticular bob swinging on a pivot,
    and two brass cylindrical driving weights hanging on either side of the pendulum inside the trunk, all
    on a stepped plinth base with bracket feet

    '
  must_have:
  - case about 2.05 m tall; bonnet 0.56 m wide, waisted trunk 0.40 m wide, plinth 0.50 m wide, so the silhouette
    steps in at the trunk and back out at the base
  - the trunk door pane is CLEAR GLASS with base-colour alpha at most 0.25, so the pendulum bob and both weights
    are visible THROUGH the closed door
  - hinged trunk door with a revolute joint on one side swinging at least 90 degrees open, with two visible
    brass hinge barrels on the hinge edge
  - 'pendulum: a slim rod hanging from a revolute pivot behind the dial, limits -0.30 to +0.30 rad, carrying
    a polished brass LENTICULAR bob about 0.14 m across near the bottom of the trunk'
  - two brass cylindrical driving weights about 0.07 m across and 0.22 m long hanging inside the trunk, one
    either side of the pendulum rod, not touching it
  - hour hand and minute hand on the dial axis, each on its own CONTINUOUS joint (not revolute), spinning
    about the dial normal
  - brass dial about 0.30 m across with a distinctly lighter silvered chapter ring band around its outer edge
    and dark hands against it
  - 'broken-arch bonnet: two arched crestings with a gap between them, two turned finials, and a reeded column
    each side of the dial'
  - stepped plinth base with bracket feet, standing on the ground plane
  - 'four visibly distinct materials: dark chocolate walnut case, near-black mouldings and plinth edges, warm
    polished brass dial/bob/weights, and clear glass'
  - the door and the pendulum clear the case through their whole joint range
  dimensions_m:
    width: 0.56
    depth: 0.3
    height: 2.05
