# h2h_designmode_v1 — generated 2026-09-25 from the design-mode repo (commit 465e8ad); edit here, not by hand-copying.
name: h2h_designmode_v1
track: static_object
language: threejs
description: 100 object briefs from github.com/jameson475/3d_batch_with_designmode (Claude Design outputs in its
